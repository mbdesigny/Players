<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3EFE4">
  <title>أُنْس — غير متصل</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      font-family:'Alan Sans',system-ui,sans-serif;background:#F3EFE4;color:#2C3E30;text-align:center;padding:24px}
    @media (prefers-color-scheme:dark){body{background:#000;color:#E0F2E9}}
    .card{max-width:420px}
    .mark{width:96px;height:96px;margin:0 auto 22px;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.15)}
    h1{font-size:24px;margin:0 0 10px}
    p{font-size:15px;opacity:.75;line-height:1.7;margin:0 0 22px}
    button{font:inherit;font-size:15px;padding:11px 26px;border-radius:999px;border:1px solid #ba9743;
      background:transparent;color:inherit;cursor:pointer}
    button:hover{background:rgba(186,151,67,.14)}
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="/favicon.svg" alt="">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذّر تحميل أُنْس. تحقّق من اتصالك ثم أعد المحاولة — الصفحات التي زرتها سابقًا تعمل دون اتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
